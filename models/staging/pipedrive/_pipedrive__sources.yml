version: 2

sources:
  - name: pipedrive
    description: >
      Pipedrive CRM data, exported as CSVs and loaded straight into Postgres
      (see init.sql / raw_data/load_data.sh). There is no `deals` table, so a
      deal's details and stage history have to be rebuilt from `deal_changes`.
    database: postgres
    schema: public
    tables:
      - name: activity
        description: >
          Pipedrive activities (calls, meetings, follow-ups) tied to deals.
          About half of each activity type is marked `done`.
        columns:
          - name: activity_id
            description: Activity id (not unique in the raw data; some ids repeat).
          - name: type
            description: Activity type code. See `activity_types.type`.
          - name: assigned_to_user
            description: Id of the user the activity is assigned to. See `users.id`.
          - name: deal_id
            description: The deal the activity relates to.
          - name: done
            description: Whether the activity has been marked done.
          - name: due_to
            description: When the activity is due.

      - name: activity_types
        description: Maps activity type codes to the names people see (4 rows).
        columns:
          - name: id
            description: Unique id.
          - name: name
            description: >
              The activity type name people see, e.g. "Sales Call 1" (type=meeting)
              and "Sales Call 2" (type=sc_2). These are funnel steps 2.1 and 3.1.
          - name: active
            description: Whether the activity type is in use ("Yes"/"No").
          - name: type
            description: Activity type code, matches `activity.type`.

      - name: deal_changes
        description: >
          One row for every change made to a deal (15,406 rows across 1,995
          deals). Each deal has about one `add_time` and one `lost_reason` (a few
          have a second), while `stage_id` and `user_id` change several times.
          Stage changes are not in order: deals can skip stages or go back.
        columns:
          - name: deal_id
            description: The deal id.
          - name: change_time
            description: When the change happened.
          - name: changed_field_key
            description: >
              Which field changed: `stage_id` (the stage, see `stages`),
              `user_id` (the owner, see `users`), `add_time` (when the deal was
              created), or `lost_reason` (see `fields`). `lost_reason` is filled
              in for every deal, so we treat it as just an attribute, not a real
              "this deal was lost" flag.
          - name: new_value
            description: The field's new value after the change, stored as text.

      - name: fields
        description: >
          Details about each deal field, including the labels behind option
          codes (4 rows).
        columns:
          - name: id
            description: Unique id.
          - name: field_key
            description: Field key, matches `deal_changes.changed_field_key`.
          - name: name
            description: The field name people see.
          - name: field_value_options
            description: >
              JSON list of {id, label} choices for fields that have a fixed set
              of options (filled in for `stage_id` and `lost_reason`; for
              `stage_id` it matches the `stages` table).

      - name: stages
        description: >
          Pipedrive pipeline stages (9 rows), one for each funnel step 1 to 9
          in the brief.
        columns:
          - name: stage_id
            description: >
              Stage id, matches `deal_changes.new_value` when
              `changed_field_key = 'stage_id'`.
          - name: stage_name
            description: Stage name, e.g. "Lead Generation".

      - name: users
        description: Pipedrive users / sales reps (1,787 rows).
        columns:
          - name: id
            description: >
              User id, matches `deal_changes.new_value` when
              `changed_field_key = 'user_id'` and `activity.assigned_to_user`.
          - name: name
            description: The user's full name.
          - name: email
            description: The user's email address.
          - name: modified
            description: When the user record was last changed.
