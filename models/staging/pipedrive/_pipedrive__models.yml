version: 2

models:
  - name: stg_pipedrive__activity
    description: One row per Pipedrive activity (calls, meetings, etc.), renamed and retyped.
    columns:
      - name: activity_id
        description: >
          Activity id. Not unique (11 ids repeat across 4,579 rows), so don't
          use it as a key.
        data_tests:
          - not_null
      - name: deal_id
        description: The deal the activity relates to.
        data_tests:
          - not_null
      - name: assigned_to_user_id
        description: Id of the user the activity is assigned to.
      - name: activity_type_code
        description: Activity type code; links to stg_pipedrive__activity_types.activity_type_code.
        data_tests:
          - not_null
          - accepted_values:
              values: ['meeting', 'sc_2', 'follow_up', 'after_close_call']
      - name: is_done
        description: Whether the activity is marked done.
        data_tests:
          - not_null
      - name: due_at
        description: When the activity is due.

  - name: stg_pipedrive__activity_types
    description: Maps activity type codes to the names people see.
    columns:
      - name: activity_type_id
        description: Unique id.
        data_tests:
          - unique
          - not_null
      - name: activity_type_code
        description: Activity type code, matches stg_pipedrive__activity.activity_type_code.
        data_tests:
          - unique
          - not_null
      - name: activity_type_name
        description: The activity type name people see.
        data_tests:
          - not_null
      - name: is_active
        description: Whether the activity type is in use.

  - name: stg_pipedrive__deal_changes
    description: >
      One row for each change to a deal. This is the only record of deal
      history; there is no `deals` table in the raw data.
    columns:
      - name: deal_id
        description: The deal id.
        data_tests:
          - not_null
      - name: changed_field_key
        description: Which field this change is about.
        data_tests:
          - not_null
          - accepted_values:
              values: ['stage_id', 'user_id', 'add_time', 'lost_reason']
      - name: new_value
        description: The field's new value after the change, stored as text.
      - name: changed_at
        description: When the field changed.
        data_tests:
          - not_null

  - name: stg_pipedrive__stages
    description: Pipedrive pipeline stages, one per funnel step 1 to 9.
    columns:
      - name: stage_id
        description: Stage id (1 to 9); same as the funnel step number.
        data_tests:
          - unique
          - not_null
      - name: stage_name
        description: The stage name people see.
        data_tests:
          - not_null
