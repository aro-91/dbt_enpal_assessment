version: 2

models:
  - name: stg_activity
    description: "Staging model for CRM activities. Standardizes raw activity data from Pipedrive source."
    columns:
      - name: activity_id
        description: "{{ doc('activity_id') }}"
        tests:
          - not_null
          - unique
      - name: assigned_user_id
        description: "{{ doc('assigned_user_id') }}"
      - name: deal_id
        description: "{{ doc('deal_id') }}"
      - name: is_done
        description: "{{ doc('is_done') }}"
      - name: due_to_at
        description: "{{ doc('due_to_at') }}"
      - name: activity_type_category
        description: "{{ doc('activity_type_category') }}"
        test:
            - not_null
            - accepted_values:
                values: ['meeting', 'follow_up','sc_2', 'after_close_call']

  - name: stg_activity_types
    description: "Staging model for CRM activity types from Pipedrive source."
    columns:
      - name: activity_type_id
        description: "{{ doc('activity_type_id') }}"
        tests:
          - not_null
          - unique
      - name: activity_type_name
        description: "{{ doc('activity_type_name') }}"
      - name: activity_type_category
        description: "{{ doc('activity_type_category') }}"
      - name: is_active
        description: "{{ doc('is_active') }}"

  - name: stg_deal_changes
    description: "Staging model for tracking changes in deals from Pipedrive source."
    columns:
      - name: change_id
        description: "{{ doc('change_id') }}"
      - name: deal_id
        description: "{{ doc('deal_id') }}"
      - name: changed_at
        description: "{{ doc('stage_start_time') }}"
      - name: changed_field_key
        description: "{{ doc('changed_field_key') }}"
      - name: new_value
        description: "{{ doc('new_value') }}"

  - name: stg_fields
    description: "Staging model for fields in Pipedrive CRM."
    columns:
      - name: field_id
        description: "{{ doc('field_id') }}"
        tests:
          - not_null
          - unique
      - name: field_key
        description: "{{ doc('field_key') }}"
      - name: field_name
        description: "{{ doc('field_name') }}"
      - name: field_value_options
        description: "{{ doc('field_value_options') }}"

  - name: stg_stages
    description: "Staging model for deal stages in Pipedrive CRM."
    columns:
      - name: stage_id
        description: "{{ doc('stage_id') }}"
        tests:
          - not_null
          - unique
      - name: stage_name
        description: "{{ doc('stage_name') }}"

  - name: stg_users
    description: "Staging model for users in Pipedrive CRM."
    columns:
      - name: user_id
        description: "{{ doc('user_id') }}"
        tests:
          - not_null
          - unique
      - name: user_name
        description: "{{ doc('user_name') }}"
      - name: user_email
        description: "{{ doc('user_email') }}"
      - name: modified_at
        description: "{{ doc('modified_at') }}"