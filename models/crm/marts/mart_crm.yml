version: 2

models:
  - name: mart_rep_sales_funnel_monthly
    description: >
      Monthly reporting model for the sales funnel.
      Aggregates deal stages and call funnel activities into
      standard funnel KPIs, from Lead Generation to Renewal/Expansion.
      A deal_id might appear in multiple steps during the same
      month, therefore the number of deals is not unique across funnel steps.

    columns:
      - name: month_reported
        description: "{{ doc('month_name') }}"
      - name: kpi_name
        description: "{{ doc('kpi_name') }}"
      - name: funnel_step
        description: "{{ doc('funnel_step') }}"
      - name: deals_count
        description: "{{ doc('deals_count') }}"
