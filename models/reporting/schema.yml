version: 2

models:
  - name: rep_sales_funnel_monthly
    description: |
      Monthly sales funnel report showing the number of deals progressing through each stage.
      
      This report tracks 11 funnel steps:
      - Step 1: Lead Generation (deal creation)
      - Step 2: Qualified Lead
      - Step 2.1: Sales Call 1 (sub-step)
      - Step 3: Needs Assessment
      - Step 3.1: Sales Call 2 (sub-step)
      - Step 4: Proposal/Quote Preparation
      - Step 5: Negotiation
      - Step 6: Closing
      - Step 7: Implementation/Onboarding
      - Step 8: Follow-up/Customer Success
      - Step 9: Renewal/Expansion
      
      Each row represents the count of unique deals that reached a specific funnel step 
      in a given month.
    
    columns:
      - name: month
        description: "Month (first day of month) when deals reached this funnel step"
        tests:
          - not_null
      
      - name: kpi_name
        description: "Name of the KPI/stage (e.g., 'Lead Generation', 'Qualified Lead')"
        tests:
          - not_null
      
      - name: funnel_step
        description: "Formatted funnel step with step number (e.g., 'Step 1: Lead Generation')"
        tests:
          - not_null
          - accepted_values:
              values:
                - 'Step 1: Lead Generation'
                - 'Step 2: Qualified Lead'
                - 'Step 2.1: Sales Call 1'
                - 'Step 3: Needs Assessment'
                - 'Step 3.1: Sales Call 2'
                - 'Step 4: Proposal/Quote Preparation'
                - 'Step 5: Negotiation'
                - 'Step 6: Closing'
                - 'Step 7: Implementation/Onboarding'
                - 'Step 8: Follow-Up/Customer Success'
                - 'Step 9: Renewal/Expansion'
      
      - name: deals_count
        description: "Number of unique deals that reached this funnel step in this month"
        tests:
          - not_null
