version: 2

models:
  - name: rep_sales_funnel_monthly
    description: >
      Monthly sales funnel report: for each calendar month and funnel step,
      the number of distinct deals that entered that funnel step in that
      month. Stage steps follow Pipedrive's funnel convention - a deal that
      reached a given stage counts as having entered every earlier stage too
      (skipped stages back-filled). Covers funnel steps 1-9 (Lead Generation
      through Renewal/Expansion) plus sub-steps 2.1 (Sales Call 1) and 3.1
      (Sales Call 2). Named `rep_sales_funnel_monthly` (not `rpt_`) to match
      the exact model name required by the assessment brief.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - month
            - funnel_step
    columns:
      - name: month
        description: Calendar month (1st of month) the milestone was reached in.
        data_tests:
          - not_null
      - name: kpi_name
        description: Funnel step / KPI display name.
        data_tests:
          - not_null
          - accepted_values:
              values:
                - 'Lead Generation'
                - 'Qualified lead'
                - 'Sales Call 1'
                - 'Needs Assessment'
                - 'Sales Call 2'
                - 'Proposal/Quote Preparation'
                - 'Negotiation'
                - 'Closing'
                - 'Implementation/Onboarding'
                - 'Follow-up/Customer Success'
                - 'Renewal/Expansion'
      - name: funnel_step
        description: >
          Funnel step number (1-9 for pipeline stages, 2.1/3.1 for the two
          sales-call sub-steps).
        data_tests:
          - not_null
          - accepted_values:
              values: [1, 2, 2.1, 3, 3.1, 4, 5, 6, 7, 8, 9]
      - name: deals_count
        description: Number of distinct deals that entered this funnel step in this month.
        data_tests:
          - not_null
