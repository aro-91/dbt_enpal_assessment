version: 2

models:
  - name: rep_sales_funnel_monthly
    description: >
      Monthly sales funnel report showing the number of deals at each funnel step.
      Combines stage-based funnel steps (from deal_changes) and activity-based steps 
      (Sales Call 1 and Sales Call 2 from activities).
      
      Funnel Steps:
        - Step 1: Lead Generation
        - Step 2: Qualified Lead
        - Step 2.1: Sales Call 1
        - Step 3: Needs Assessment
        - Step 3.1: Sales Call 2
        - Step 4: Proposal/Quote Preparation
        - Step 5: Negotiation
        - Step 6: Closing
        - Step 7: Implementation/Onboarding
        - Step 8: Follow-up/Customer Success
        - Step 9: Renewal/Expansion
    columns:
      - name: month
        description: "Month of the funnel data (format: YYYY-MM)"
        tests:
          - not_null
      - name: kpi_name
        description: "Name of the funnel step/KPI (e.g., Lead Generation, Sales Call 1)"
        tests:
          - not_null
      - name: funnel_step
        description: "Step identifier in the funnel (e.g., Step 1, Step 2.1, Step 3)"
        tests:
          - not_null
      - name: deals_count
        description: "Number of distinct deals that reached this funnel step in the given month"
        tests:
          - not_null
