version: 2

sources:
  - name: pipedrive
    database: postgres
    schema: public
    description: >
      Raw Pipedrive CRM export. No native deals table exists. The deal
      entity is reconstructed downstream from deal_changes, an audit log
      of field updates per deal.
    tables:
      - name: deal_changes
        description: >
          Changelog of field updates per deal, one row per deal_id/field/
          change. changed_field_key takes one of four values: add_time,
          user_id, stage_id, lost_reason. new_value is polymorphic text;
          its real type depends on changed_field_key.
        columns:
          - name: deal_id
            description: >
              Pipedrive deal identifier. Not a standalone dimension.
              deal_changes is the only source of deal-level facts.
          - name: change_time
            description: Timestamp the field change was recorded.
          - name: changed_field_key
            description: "Which field changed: add_time, user_id, stage_id, or lost_reason."
          - name: new_value
            description: New value as text. Cast downstream per changed_field_key.

      - name: activity
        description: >
          Pipedrive activities (calls, meetings, follow-ups) logged
          against a deal. activity.deal_id does not reliably reference
          deal_changes.deal_id: only 8 of 4,572 activity deal_ids appear
          anywhere in deal_changes. Treat the two tables as independent
          deal-id spaces until proven otherwise.
        columns:
          - name: activity_id
            description: >
              Not unique: 11 activity_id values appear twice each.
              Dedupe before treating it as a primary key.
          - name: type
            description: Text code that joins to activity_types.type, not activity_types.id.
          - name: assigned_to_user
            description: Foreign key to users.id.
          - name: deal_id
          - name: done
            description: Whether the activity was completed.
          - name: due_to
            description: >
              Scheduled or due timestamp. Used as the completion month
              when done is true; the source has no separate completed_at
              field.

      - name: activity_types
        description: Reference list of activity type codes and display names.
        columns:
          - name: id
          - name: name
            description: "Human-readable label, e.g. Sales Call 1, Sales Call 2."
          - name: active
            description: Yes/No text flag. Cast to boolean in staging.
          - name: type
            description: Short code that activity.type joins on.

      - name: fields
        description: >
          Pipedrive field metadata. field_value_options holds JSON enum
          options for select-type fields such as stage_id and lost_reason.
          This is the canonical source for stage display names; see the
          casing mismatch noted on the stages table.
        columns:
          - name: id
          - name: field_key
            description: "For example: stage_id, lost_reason, add_time, user_id."
          - name: name
          - name: field_value_options
            description: JSONB array of id/label objects for enum fields. Null for every other field.

      - name: stages
        description: >
          Pipeline stage dimension. stage_name disagrees in casing with
          the labels embedded in fields.field_value_options for the same
          stage_id: stage 2 is "Qualified lead" here and "Qualified Lead"
          there. Downstream models treat the fields JSON as canonical,
          since it matches the exact KPI naming the brief requires.
          Declared here for discoverability; deliberately not modeled.
        columns:
          - name: stage_id
          - name: stage_name

      - name: users
        description: >
          Pipedrive users, one row per deal owner. Sourced directly by
          the proposed rep_deal_ownership_by_stage analysis; nothing in
          models/ reads it.
        columns:
          - name: id
          - name: name
          - name: email
          - name: modified
