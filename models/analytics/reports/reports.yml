version: 2

models:
  - name: rep_sales_funnel_monthly
    description: "Monthly sales funnel report. Contains aggregated data on deals, and activities for each month."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - month
            - kpi_name
    columns:
      - name: month
        description: "Month of the funnel step, formatted as YYYY-MM"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              regex: '^\d{4}-\d{2}$'
      - name: kpi_name
        description: "Name of the KPI funnel step (e.g., 'Lead Generation', 'Sales Call 1')"
        tests:
          - not_null
      - name: funnel_step
        description: "Funnel step number, indicating the order of the step in the sales process (e.g., 1, 2, 2.1, 3, 3.1, 4, 5, etc.)"
        tests:
          - not_null
      - name: deals_count
        description: "Count of deals in the funnel step for the month"
        tests:
          - not_null
