version: 2

models:
  - name: dim_activities
    description: "Pipedrive activity dimension. Contains unique identifiers and attributes for activities, such as type, completion status, due date, assigned user, and associated deal."
    columns:
      - name: unique_id
        description: "Unique identifier for the activity record"
        tests:
          - unique
          - not_null
      - name: activity_id
        description: "Unique identifier for the activity"
        tests:
          - not_null
      - name: activity_type
        description: "Type of the activity (e.g., task, call, meeting)"
        tests:
          - not_null
      - name: is_completed
        description: "Indicates if the activity is completed"
        tests:
          - not_null
      - name: due_at
        description: "Due date and time when the activity is scheduled or due"
        tests:
          - not_null
      - name: assigned_user_id
        description: "User assigned to the activity"
        tests:
          - not_null
      - name: deal_id
        description: "ID of the deal associated with the activity"
        tests:
          - not_null
      - name: _last_synced
        description: "Timestamp when the activity record was last synced to the database"
        tests:
          - not_null

  - name: dim_activity_types
    description: "Pipedrive activity type dimension. Contains unique identifiers and attributes for activity types, such as name, type, and active status."
    columns:
      - name: activity_type_id
        description: "Unique identifier for the activity type"
        tests:
          - unique
          - not_null
      - name: activity_name
        description: "Name of the activity type"
        tests:
          - not_null
      - name: activity_type
        description: "Type of the activity (e.g., task, call, meeting)"
        tests:
          - not_null
      - name: is_active
        description: "Indicates if the activity type is currently active"
        tests:
          - not_null
      - name: _last_synced
        description: "Timestamp when the activity type record was last synced to the database"
        tests:
          - not_null

  - name: dim_deal_changes
    description: "Pipedrive deal changes dimension. Contains unique identifiers and attributes for deal changes, such as field name, new value, and modification timestamp."
    columns:
      - name: unique_id
        description: "Unique identifier for the deal change record"
        tests:
          - unique
          - not_null
      - name: deal_id
        description: "ID of the deal associated with the change"
        tests:
          - not_null
      - name: change_field_name
        description: "Name of the field that was changed in the deal"
        tests:
          - not_null
      - name: new_value
        description: "New value of the field after the change"
        tests:
          - not_null
      - name: modified_at
        description: "Timestamp when the deal change was made"
        tests:
          - not_null
      - name: _last_synced
        description: "Timestamp when the deal change record was last synced to the database"
        tests:
          - not_null

  - name: dim_fields
    description: "Pipedrive fields dimension. Contains unique identifiers and attributes for fields, such as field key, name, value options, and associated option IDs."
    columns:
      - name: unique_id
        description: "Unique identifier for the field record"
        tests:
          - unique
          - not_null
      - name: field_key
        description: "Key of the field, used for identification"
        tests:
          - not_null
      - name: field_name
        description: "Name of the field"
        tests:
          - not_null
      - name: field_value_properties
        description: "Properties of the field value, such as option_id and label"
      - name: option_id
        description: "ID of the option associated with the field value"
      - name: label
        description: "Label of the field option"
      - name: _last_synced
        description: "Timestamp when the field record was last synced to the database"
        tests:
          - not_null

  - name: dim_stages
    description: "Pipedrive stages dimension. Contains unique identifiers and attributes for stages, such as stage ID, name, and last synced timestamp."
    columns:
      - name: stage_id
        description: "Unique identifier for the stage"
        tests:
          - unique
          - not_null
      - name: stage_name
        description: "Name of the stage"
        tests:
          - not_null
      - name: _last_synced
        description: "Timestamp when the stage record was last synced to the database"
        tests:
          - not_null

  - name: dim_users
    description: "Pipedrive users dimension. Contains unique identifiers and attributes for users, such as user ID, name, email, and last synced timestamp."
    columns:
      - name: user_id
        description: "Unique identifier for the user"
        tests:
          - unique
          - not_null
      - name: user_name
        description: "Name of the user"
        tests:
          - not_null
      - name: email
        description: "Email address of the user"
        tests:
          - not_null
      - name: modified_at
        description: "Timestamp when the user record was last modified"
        tests:
          - not_null
      - name: _last_synced
        description: "Timestamp when the user record was last synced to the database"
        tests:
          - not_null

  - name: fct_deal_activities
    description: "Contains data related to deal activities, including deal Id, activity ID, type, completion status, due date, assigned user."
    columns:
      - name: unique_id
        description: "Unique identifier for the deal activity record"
        tests:
          - unique
          - not_null
      - name: deal_id
        description: "ID of the deal associated with the activity"
        tests:
          - not_null
      - name: activity_id
        description: "Unique identifier for the activity"
        tests:
          - not_null
      - name: activity_name
        description: "Name of the activity type"
        tests:
          - not_null
      - name: activity_type
        description: "Type of the activity (e.g., task, call, meeting)"
        tests:
          - not_null
      - name: is_active_activity
        description: "Indicates if the activity type is currently active"
        tests:
          - not_null
      - name: is_completed
        description: "Indicates if the activity is completed"
        tests:
          - not_null
      - name: due_at
        description: "Due date and time when the activity is scheduled or due"
        tests:
          - not_null
      - name: assigned_user_id
        description: "User assigned to the activity"
        tests:
          - not_null
      - name: max_updated_at
        description: "Maximum timestamp when the activity or its type was last updated"
        tests:
          - not_null

  - name: fct_deal_funnel_stages
    description: "Contains data related to deal funnel stages, including deal ID, stage ID, stage name, and last updated timestamp."
    columns:
      - name: unique_id
        description: "Unique identifier for the deal funnel stage record"
        tests:
          - unique
          - not_null
      - name: deal_id
        description: "ID of the deal associated with the stage"
        tests:
          - not_null
      - name: modified_at
        description: "Timestamp when the deal was last modified"
        tests:
          - not_null
      - name: stage_id
        description: "ID of the stage in the deal funnel"
        tests:
          - not_null
      - name: stage_name
        description: "Name of the stage in the deal funnel"
        tests:
          - not_null
      - name: max_updated_at
        description: "Maximum timestamp when the deal or its stage was last updated"
        tests:
          - not_null
