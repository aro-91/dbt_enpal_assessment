version: 2

models:
  - name: int_deal_sales_call
    description: >
      One row per deal per completed (is_done = true) "Sales Call 1" /
      "Sales Call 2" activity, mapped to funnel steps 2.1 and 3.1.
    columns:
      - name: deal_sales_call_sk
        description: Surrogate key, dbt_utils.generate_surrogate_key(deal_id, activity_type_code).
        data_tests:
          - unique
          - not_null
      - name: deal_id
        description: Deal identifier.
        data_tests:
          - not_null
      - name: kpi_name
        description: KPI name ("Sales Call 1" or "Sales Call 2").
        data_tests:
          - not_null
          - accepted_values:
              values: ['Sales Call 1', 'Sales Call 2']
      - name: funnel_step
        description: Funnel step number (2.1 or 3.1).
        data_tests:
          - not_null
          - accepted_values:
              values: [2.1, 3.1]
      - name: due_at
        description: Scheduled/due timestamp for the activity.
        data_tests:
          - not_null
      - name: month
        description: Calendar month (1st of month) `due_at` falls in.
        data_tests:
          - not_null

  - name: int_deal_stage_history
    description: >
      One row per deal per pipeline stage it has entered. Skipped stages are
      back-filled (a deal that reached stage N counts as having entered every
      stage 1..N), matching Pipedrive's native funnel/conversion report
      convention. Funnel steps 1-9 map 1:1 to `stage_id`/`stage_name`.
    columns:
      - name: deal_stage_sk
        description: Surrogate key, dbt_utils.generate_surrogate_key(deal_id, stage_id).
        data_tests:
          - unique
          - not_null
      - name: deal_id
        description: Deal identifier.
        data_tests:
          - not_null
      - name: stage_id
        description: Pipeline stage identifier (1-9).
        data_tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5, 6, 7, 8, 9]
      - name: stage_name
        description: Human-readable stage name.
        data_tests:
          - not_null
      - name: funnel_step
        description: Funnel step number (= stage_id for stage-based steps).
        data_tests:
          - not_null
      - name: entered_at
        description: >
          First timestamp the deal reached this stage or a later one. For
          explicitly recorded stages this is the actual change time; for
          back-filled (skipped) stages it is the time of the jump that carried
          the deal past this stage.
        data_tests:
          - not_null
      - name: month
        description: Calendar month (1st of month) `entered_at` falls in.
        data_tests:
          - not_null
