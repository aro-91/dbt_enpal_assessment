version: 2

models:
  - name: int_deal_sales_call
    description: >
      One row per deal per finished (is_done = true) "Sales Call 1" /
      "Sales Call 2" activity. These are funnel steps 2.1 and 3.1.
    columns:
      - name: deal_sales_call_sk
        description: Unique key built from deal_id and activity_type_code (dbt_utils.generate_surrogate_key).
        data_tests:
          - unique
          - not_null
      - name: deal_id
        description: The deal id.
        data_tests:
          - not_null
      - name: kpi_name
        description: KPI name ("Sales Call 1" or "Sales Call 2").
        data_tests:
          - not_null
          - accepted_values:
              values: ['Sales Call 1', 'Sales Call 2']
      - name: funnel_step
        description: Funnel step number (2.1 or 3.1).
        data_tests:
          - not_null
          - accepted_values:
              values: [2.1, 3.1]
      - name: due_at
        description: When the activity is due.
        data_tests:
          - not_null
      - name: month
        description: The month `due_at` falls in (first of the month).
        data_tests:
          - not_null

  - name: int_deal_stage_history
    description: >
      One row per deal per stage it reached. Skipped stages are filled in (a
      deal that reached stage N counts at every stage 1 to N), the same way
      Pipedrive's own funnel report counts. Funnel steps 1 to 9 are the
      `stage_id` / `stage_name`.
    columns:
      - name: deal_stage_sk
        description: Unique key built from deal_id and stage_id (dbt_utils.generate_surrogate_key).
        data_tests:
          - unique
          - not_null
      - name: deal_id
        description: The deal id.
        data_tests:
          - not_null
      - name: stage_id
        description: Stage id (1 to 9).
        data_tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5, 6, 7, 8, 9]
      - name: stage_name
        description: The stage name people see.
        data_tests:
          - not_null
      - name: funnel_step
        description: Funnel step number (same as stage_id here).
        data_tests:
          - not_null
      - name: entered_at
        description: >
          When the deal first reached this stage or a later one. For stages it
          actually logged, this is the change time; for filled-in (skipped)
          stages, it is the time of the jump that took the deal past it.
        data_tests:
          - not_null
      - name: month
        description: The month `entered_at` falls in (first of the month).
        data_tests:
          - not_null
