name: 'pipedrive_dbt'
version: '1.0.0'
config-version: 2

profile: 'pipedrive_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  dev_suffix: "" 

models:
  pipedrive_dbt:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    production:
      +materialized: table
      +schema: production