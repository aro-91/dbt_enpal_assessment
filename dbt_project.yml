name: 'enpal_assessment_project'
version: '1.0.0'

profile: 'enpal_assessment_project'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models


models:
  enpal_assessment_project:
    +schema: pipedrive_analytics
    01_staging:
      +materialized: view
      +schema: pipedrive_staging
    02_transform:
      +materialized: view
      +schema: pipedrive_transform
    03_mart:
      +materialized: table
      +schema: pipedrive_mart
